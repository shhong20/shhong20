<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="shhong20, building useful AI systems. RAG, MCP, Applied ML.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1426"/>
      <stop offset="54%" stop-color="#101A35"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57DED1"/>
      <stop offset="55%" stop-color="#7CA9FF"/>
      <stop offset="100%" stop-color="#A48BFF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#4F72EA" stop-opacity="0.27"/>
      <stop offset="100%" stop-color="#4F72EA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6B86A8" stroke-width="0.65" opacity="0.13"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="380" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <circle cx="1000" cy="195" r="430" fill="url(#glow)"/>
    <path d="M0 0H1280" stroke="#8095BA" stroke-opacity=".17"/>
    <rect x="62" y="49" width="4" height="21" rx="2" fill="#63E1D6"/>
    <text x="81" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3.6" fill="#99AAC8">SHHONG20  /  ENGINEERING PORTFOLIO</text>
    <text x="63" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="760" fill="#F4F7FF">Building useful</text>
    <text x="63" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="760" fill="url(#accent)">AI systems.</text>
    <text x="65" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#B6C5DE">From research prototypes to reliable software.</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">
