      <text x="102" y="320" fill="#8DF0DF" text-anchor="middle">RAG</text>
      <rect x="150" y="296" width="82" height="37" rx="18" fill="#1D2947" stroke="#516895" stroke-opacity=".75"/>
      <text x="191" y="320" fill="#A9CAFF" text-anchor="middle">MCP</text>
      <rect x="241" y="296" width="151" height="37" rx="18" fill="#282541" stroke="#66518C" stroke-opacity=".75"/>
      <text x="316" y="320" fill="#C9B7FF" text-anchor="middle">APPLIED ML</text>
    </g>
    <!-- Abstract pipeline: data, retrieval, reasoning and deployed tools. -->
    <g fill="none" stroke="#6E8CB8" stroke-opacity=".25" stroke-width="1.5">
