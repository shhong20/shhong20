      <circle cx="1186" cy="285" r="7" fill="#161F3B" stroke="#90B4FF"/>
      <circle cx="1219" cy="225" r="6" fill="#172A4A" stroke="#69DECE"/>
    </g>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#B9CCE8">
      <text x="803" y="88">DATA</text>
      <text x="812" y="310">TOOLS</text>
      <text x="1177" y="112">ML</text>
